<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batch Image Renamer</title>
  </head>
  <body>
    <main class="app">
      <h1>Batch Image Renamer</h1>
      <p class="subtitle">Rename images based on what a vision-enabled LLM can see in them.</p>

      <form id="config-form" autocomplete="off">
        <fieldset id="config-fieldset">
          <label>
            Image folder
            <div class="path-row">
              <input type="text" id="image_folder" placeholder="/path/to/images" required />
              <button type="button" class="browse" data-target="image_folder">Browse…</button>
            </div>
          </label>

          <label>
            Output folder <span class="hint">(optional: leave empty to rename images in place)</span>
            <div class="path-row">
              <input type="text" id="output_folder" placeholder="Leave empty to rename in place" />
              <button type="button" class="browse" data-target="output_folder">Browse…</button>
              <button type="button" id="clear_output" title="Clear">✕</button>
            </div>
          </label>

          <label>
            Filename prefix
            <input type="text" id="filename_prefix" placeholder="e.g. plate_" />
          </label>

          <label>
            Server URL
            <input type="text" id="server_url" required />
          </label>

          <label>
            Task prompt
            <textarea id="prompt" rows="4"></textarea>
          </label>

          <label class="narrow">
            Max tokens <span class="hint">(-1 = unlimited)</span>
            <input type="number" id="max_tokens" step="1" />
          </label>

          <fieldset class="extensions">
            <legend>Extensions</legend>
            <label class="inline"><input type="checkbox" class="ext" value="jpg" checked /> jpg</label>
            <label class="inline"><input type="checkbox" class="ext" value="jpeg" checked /> jpeg</label>
            <label class="inline"><input type="checkbox" class="ext" value="png" /> png</label>
            <label class="inline"><input type="checkbox" class="ext" value="webp" /> webp</label>
          </fieldset>
        </fieldset>

        <div class="actions">
          <button type="submit" id="start-btn">Start</button>
          <button type="button" id="stop-btn" class="danger" hidden>Stop</button>
        </div>
      </form>

      <section class="run-area">
        <progress id="progress-bar" value="0" max="1"></progress>
        <div class="run-meta">
          <span id="current-file">Idle</span>
          <span id="counts"></span>
        </div>
        <ul id="status-log" class="status-log"></ul>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
